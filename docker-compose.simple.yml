version: '3.8'

services:
  # Main Application - In-Memory Only
  sentiment-app:
    build: .
    container_name: sentiment_app
    environment:
      - NODE_ENV=production
    ports:
      - "3000:3000"
    restart: unless-stopped
    volumes:
      - ./data:/app/data
      - backup_data:/app/data/backup

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: sentiment_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - sentiment-app
    restart: unless-stopped

volumes:
  backup_data:
